services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: agentlens
      MYSQL_USER: agentlens
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/agentlens?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
      DB_USER: agentlens
      DB_PASSWORD: ${DB_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      AGENT_ALLOWED_ORIGINS: ${AGENT_ALLOWED_ORIGINS:-}
      AGENT_SECRET_CUSTOMER: ${AGENT_SECRET_CUSTOMER:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
  web:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
volumes:
  mysql-data:
